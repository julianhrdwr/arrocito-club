
name: Build Arrocito Club APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Capacitor project
        run: |
          mkdir arrocito-android
          cd arrocito-android
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Arrocito Club" "com.arrocitoclub.app" --web-dir www
          mkdir www
          cp ../index.html www/
          cp ../manifest.webmanifest www/
          cp ../sw.js www/
          cp ../icon.svg www/
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd arrocito-android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arrocito-club-apk
          path: arrocito-android/android/app/build/outputs/apk/debug/app-debug.apk
          
